<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
        <h1>Calculator</h1>
        <input type="text" id="screen" class="screen" disabled>
        
        <div class="buttons">
            <!-- Row 1 -->
            <button class="btn op" onclick="clearScreen()">C</button>
            <button class="btn op" onclick="press('%')">%</button>
            <button class="btn op" onclick="toggleAdvanced()">🔀</button>
            <button class="btn operator" onclick="press('/')">÷</button>
            
            <!-- Row 2 -->
            <button class="btn num" onclick="press('7')">7</button>
            <button class="btn num" onclick="press('8')">8</button>
            <button class="btn num" onclick="press('9')">9</button>
            <button class="btn operator" onclick="press('*')">×</button>
            
            <!-- Row 3 -->
            <button class="btn num" onclick="press('4')">4</button>
            <button class="btn num" onclick="press('5')">5</button>
            <button class="btn num" onclick="press('6')">6</button>
            <button class="btn operator" onclick="press('-')">−</button>
            
            <!-- Row 4 -->
            <button class="btn num" onclick="press('1')">1</button>
            <button class="btn num" onclick="press('2')">2</button>
            <button class="btn num" onclick="press('3')">3</button>
            <button class="btn operator" onclick="press('+')">+</button>

            <!-- Row 5 -->
            <button class="btn num zero" onclick="press('0')">0</button>
            <button class="btn num" onclick="press('.')">.</button>
            <button class="btn equal" onclick="calculate()">=</button>
        </div>

        <!-- Other Operations -->
        <div class="buttons advanced hidden">
            <button class="btn op" onclick="square()">x²</button>
            <button class="btn op" onclick="squareRoot()">√</button>
            <button class="btn op" onclick="logBase10()">log10</button>
            <button class="btn op" onclick="exponential()">1/x</button>
            <button class="btn op" onclick="sineFunction()">sin</button>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
